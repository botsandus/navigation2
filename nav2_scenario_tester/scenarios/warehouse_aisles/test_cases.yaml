test_cases:
  - name: straight_line_forward
    # Verifies nominal forward motion in clear space; expect a near-straight
    # traversal to the goal while staying within distance, speed, acceleration,
    # and tracking-error limits.
    initial_pose: {x: 86.0, y: 33.0, yaw: -1.57}
    goal_pose: {x: 86.0, y: 22.0, yaw: -1.57}
    limits:
      distance_travelled: [null, 12.0]
      linear_speed: [null, 0.5]
      angular_speed: [null, 0.8]
      position_tracking_error: [null, 0.2]
      linear_acceleration: [null, 0.3]
  - name: straight_line_backward
    # Verifies nominal backward motion in clear space; expect a near-straight
    # traversal to the goal while staying within distance, speed, acceleration,
    # tracking-error limits and without rotating.
    initial_pose: {x: 86.0, y: 22.0, yaw: -1.57}
    goal_pose: {x: 86.0, y: 33.0, yaw: -1.57}
    limits:
      distance_travelled: [null, 12.0]
      linear_speed: [null, 0.5]
      angular_speed: [null, 0.8]
      position_tracking_error: [null, 0.2]
  - name: obstacle_near_straight_path
    # Verifies the controller can take a distance margin from an obstacle
    # when tracking a straight path in free space
    initial_pose: {x: 86.092621, y: 33.756149, yaw: -1.541884}
    goal_pose: {x: 86.351738, y: 22.574089, yaw: -1.600002}
    obstacles:
      - [[87.325424, 28.452196], [86.786751, 28.475378], [87.126793, 28.135109]]
    limits:
      center_cost: [null, 200]
  - name: straight_path_between_obstacles
    # Verifies narrow-passage behavior between obstacles on both sides; expect
    # successful traversal through the gap without large detours and while keeping
    # a similar distance margin from both obstacles.
    initial_pose: {x: 86.09, y: 33.76, yaw: -1.54}
    goal_pose: {x: 85.89, y: 23.18, yaw: -1.63}
    obstacles:
      - [[84.629776, 28.045177], [84.930023, 28.567486], [84.330132, 28.475439]]
      - [[87.325424, 28.452196], [86.786751, 28.475378], [87.126793, 28.135109]]
    limits:
      distance_travelled: [null, 12.0]
      center_cost: [null, 210]
  - name: inversion_in_free_space
    # Verifies that the controller abides by an inversion maneuver in open space
    initial_pose: {x: 84.74, y: 33.02, yaw: -1.51}
    goal_pose: {x: 84.93, y: 34.74, yaw: 0.58}
    limits:
      distance_travelled: [null, 3.0]
      center_cost: [null, 0]
  - name: straight_line_at_inflation_radius_border
    # Verifies tracking along a straight path close to the inflation radius border.
    # This test checks that the controller does not try to deviate too much from the path
    # because trajectories in the free space are preferred over trajectories in the inflation radius.
    initial_pose: {x: 3.74, y: 27.08, yaw: 1.50}
    goal_pose: {x: 3.75, y: 30.53, yaw: 1.55}
    limits:
      position_tracking_error: [null, 0.2]
  - name: narrow_aisle_to_narrow_aisle
    # Verifies a transition from one narrow aisle into another without getting too close to the walls
    initial_pose: {x: 78.278519, y: 9.954653, yaw: -0.004202}
    goal_pose: {x: 78.780594, y: 14.306622, yaw: 3.13739}
    limits:
      center_cost: [null, 220]
  - name: reach_goal_in_high_cost_corridor
    # Verifies that we can reach a goal that is located in a high-cost corridor
    initial_pose: {x: 80.62, y: 35.35, yaw: -3.09}
    goal_pose: {x: 79.64, y: 35.34, yaw: 3.08}
  - name: narrow_aisle_inversion
    # Verifies the behavior of inversion in a narrow aisle by going out, inverting and coming back in
    # Ideally when rotating outside the isle, the footprint should not be too close from the lethal aisle walls
    initial_pose: {x: 79.72, y: 35.26, yaw: 3.13}
    goal_pose: {x: 79.65, y: 35.23, yaw: 0.0}
  - name: blocked_by_obstacle
    # Verifies that the controller can handle a situation where the straight path to the goal is blocked by a large obstacle
    # by going around it while keeping a reasonable distance margin.
    initial_pose: {x: 22.302568, y: 44.420254, yaw: 0.007143}
    goal_pose: {x: 39.914085, y: 44.420254, yaw: 0.013274}
    obstacles:
      - [[-1.4072, 5.157939], [-1.349037, 4.401821], [-0.767408, 4.416362], [-0.781949, 5.070695]]
      - [[30.620054, 44.992714], [30.519032, 43.982494], [31.360884, 43.948818], [31.596603, 44.992714]]
map: warehouse_aisles.yaml
params: params.yaml
