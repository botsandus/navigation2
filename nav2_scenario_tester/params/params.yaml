/**:
  ros__parameters:
    enable_stamped_cmd_vel: False

bt_navigator:
  ros__parameters:
    always_reload_bt_xml: false
    bt_log_idle_transitions: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    bt_action_feedback_loop_duration_ms: 100
    default_server_timeout: 5000
    default_cancel_timeout: 5000
    wait_for_service_timeout: -1
    default_planner_tolerance: 0.0
    navigators: ["navigate_to_pose"]
    default_nav_to_pose_bt_xml: /opt/auto_ws/src/auto-sandbox/src/vendor/navigation2/nav2_bt_navigator/behavior_trees/navigate_w_replanning_only_if_goal_is_updated.xml
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_name_prefixes:
      - compute_path_to_pose
      - follow_path

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.01
    failure_tolerance: -1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    path_handler_plugins: ["PathHandlerMPPI"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 1500.0
      required_movement_angle: 2.0  # 115 deg

    # Goal checkers
    goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Path handlers
    PathHandlerMPPI:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 5.0
      max_robot_pose_search_dist: 1.0
      enforce_path_inversion: true
      enforce_path_rotation: false
      inversion_xy_tolerance: 0.4
      inversion_yaw_tolerance: 0.4
      reject_unit_path: false

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.3
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.5
      vx_min: -0.5
      vy_max: 0.5
      wz_max: 0.8
      ax_max: 0.5
      ax_min: -0.5
      ay_min: 0.0
      ay_max: 0.0
      az_max: 3.5
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      critic_index_to_visualize: 2
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: false
        cost_power: 1
        cost_weight: 7.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.4
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        critical_cost: 400.0
        near_collision_cost: 200
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.125
    costmap_update_timeout: 15.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: false
      max_iterations: -1
      max_on_approach_iterations: 1000
      max_planning_time: 8.0
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 1.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      minimum_turning_radius: 0.8
      reverse_penalty: 1.01
      change_penalty: 3.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.06
      lookup_table_size: 1.0
      cache_obstacle_heuristic: false
      use_quadratic_cost_penalty: true
      downsample_obstacle_heuristic: false
      allow_primitive_interpolation: true
      smooth_path: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      always_send_full_costmap: true
      use_maximum: true
      footprint: "[ [0.725, 0.525], [0.725, -0.525], [-0.725, -0.525], [-0.725, 0.525] ]"
      footprint_padding: 0.12
      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer_local"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "/map"
      obstacle_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "/vo_map"
      inflation_layer_local:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 0.6
        inflation_radius: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      use_maximum: true
      footprint: "[ [0.725, 0.525], [0.725, -0.525], [-0.725, -0.525], [-0.725, 0.525] ]"
      footprint_padding: 0.12
      plugins:
        - "static_layer"
        - "inflation_layer_global"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: "/map"
      inflation_layer_global:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 2.0

vector_object_server:
  ros__parameters:
    map_topic: "vo_map"
    global_frame_id: "map"
    resolution: 0.05
    default_value: 0
    update_frequency: 1.0
